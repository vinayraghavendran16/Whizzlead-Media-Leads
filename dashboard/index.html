<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whizzlead Leads</title>
<style>body{font:14px system-ui;margin:0;background:#0d1117;color:#f5f7fa}main{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.muted{color:#9aa7b5}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.card,section{background:#151c24;border:1px solid #293544;border-radius:14px;padding:16px}.card b{display:block;font-size:26px;margin-top:8px}button,input,select{padding:9px;border-radius:8px;border:1px solid #344252;background:#0f151c;color:#fff}button{background:#55b8ff;color:#071018;font-weight:700;cursor:pointer}.bar{display:flex;align-items:end;height:180px;gap:8px;border-bottom:1px solid #344252}.bar div{flex:1;background:#55b8ff;min-height:3px;position:relative}.bar span{position:absolute;top:-20px;font-size:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #293544}th{color:#9aa7b5;font-size:11px;text-transform:uppercase}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{padding:5px 8px;border-radius:20px;background:#263544}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center}.modal.open{display:grid}.box{background:#151c24;padding:20px;border-radius:14px;width:min(700px,calc(100% - 30px))}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:5px;color:#9aa7b5}.wide{grid-column:1/-1}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}}</style></head>
<body><main><div class="top"><div><div style="color:#55b8ff;font-weight:700">WHIZZLEAD MEDIA</div><h1>Lead command centre</h1><p class="muted">Track outreach, responses and pipeline movement by day.</p></div><div><button id="add">+ Add lead</button> <button id="export">Export CSV</button> <button id="import">Import CSV</button><input id="file" type="file" accept=".csv" hidden></div></div>
<div class="cards"><div class="card">Daily target<b id="target">25</b></div><div class="card">Completed today<b id="done">0</b></div><div class="card">Pending today<b id="pending">25</b></div><div class="card">Interested<b id="interested">0</b></div><div class="card">Follow-ups<b id="followups">0</b></div><div class="card">Meetings booked<b id="meet">0</b></div><div class="card">Not interested<b id="notinterested">0</b></div><div class="card">Total leads<b id="total">0</b></div></div>
<div class="grid"><section><h2>Daily outreach</h2><div id="chart" class="bar"></div></section><section><h2>Status summary</h2><div id="summary"></div></section></div>
<section style="margin-top:14px"><h2>Leads</h2><div class="toolbar"><input id="search" placeholder="Search leads"><select id="filter"><option value="">All statuses</option></select></div><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Company</th><th>Outreach date</th><th>Status</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<div id="modal" class="modal"><div class="box"><h2>Add lead</h2><form id="form" class="form"><label>Name *<input name="name" required></label><label>Company<input name="company"></label><label>Role<input name="role"></label><label>Source<select name="source"><option>LinkedIn</option><option>Referral</option><option>Email</option><option>Other</option></select></label><label>Outreach date *<input name="date" type="date" required></label><label>Status<select name="status"></select></label><label class="wide">Profile URL<input name="url"></label><label class="wide">Notes<textarea name="notes" rows="3"></textarea></label><div class="wide"><button type="button" id="cancel">Cancel</button> <button>Save lead</button></div></form></div></div>
<script>const statuses=['Researching','Ready to contact','Contacted','Connected message sent','Connection request sent','Replied','Interested','Follow-up','Meeting booked','Won','Not interested','Lost','DQ'],key='whizzlead_leads';let leads=JSON.parse(localStorage[key]||'[]'),$=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);statuses.forEach(s=>{let o=new Option(s,s);$('filter').add(o);$('form').status.add(new Option(s,s))});function contacted(x){return !['Researching','Ready to contact'].includes(x)}function response(x){return ['Replied','Interested','Follow-up','Meeting booked','Won'].includes(x)}function csvRows(t){let rows=[],row=[],cell='',quote=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(ch==='"'&&quote&&n==='"'){cell+='"';i++}else if(ch==='"'){quote=!quote}else if(ch===','&&!quote){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&n==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=ch}if(cell||row.length){row.push(cell);rows.push(row)}return rows}function save(){localStorage[key]=JSON.stringify(leads);render()}function render(){let q=$('search').value.toLowerCase(),f=$('filter').value,a=leads.filter(x=>(!q||Object.values(x).join(' ').toLowerCase().includes(q))&&(!f||x.status==f)),done=leads.filter(x=>x.date==today()&&contacted(x.status)).length;$('total').textContent=leads.length;$('done').textContent=done;$('pending').textContent=Math.max(0,25-done);$('interested').textContent=leads.filter(x=>['Interested','Replied'].includes(x.status)).length;$('followups').textContent=leads.filter(x=>x.status=='Follow-up').length;$('meet').textContent=leads.filter(x=>['Meeting booked','Won'].includes(x.status)).length;$('notinterested').textContent=leads.filter(x=>['Not interested','Lost'].includes(x.status)).length;let c=Object.fromEntries(statuses.map(s=>[s,0]));leads.forEach(x=>c[x.status]=(c[x.status]||0)+1);$('summary').innerHTML=statuses.filter(s=>c[s]).map(s=>'<p>'+s+' <span class="pill">'+c[s]+'</span></p>').join('')||'<p class="muted">No leads yet</p>';let days=[...new Set(leads.map(x=>x.date).filter(Boolean))].sort().slice(-14),mx=Math.max(1,...days.map(d=>leads.filter(x=>x.date==d).length));$('chart').innerHTML=days.map(d=>'<div style="height:'+leads.filter(x=>x.date==d).length/mx*100+'%"><span>'+d.slice(5)+'</span></div>').join('')||'<p class="muted">Add leads to see activity</p>';$('rows').innerHTML=a.map(x=>'<tr><td><b>'+x.name+'</b><br><small>'+x.role+'</small></td><td>'+x.company+'</td><td>'+x.date+'</td><td><span class="pill">'+x.status+'</span></td><td>'+x.notes+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">No matching leads</td></tr>'}$('add').onclick=()=>{$('modal').classList.add('open');$('form').reset();$('form').date.value=today();$('form').status.value='Researching'};$('cancel').onclick=()=>$('modal').classList.remove('open');$('form').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=crypto.randomUUID();leads.push(x);save();$('modal').classList.remove('open')};$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{let h=['name','company','role','source','date','status','url','notes'],csv=[h.join(','),...leads.map(x=>h.map(k=>'"'+(x[k]||'').replaceAll('"','""')+'"').join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='whizzlead-leads.csv';a.click()};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let rows=csvRows(await e.target.files[0].text()),h=rows.shift().map(x=>x.trim()),add=rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||'']))).filter(x=>x.name).map(x=>({...x,id:crypto.randomUUID(),status:x.status||'Researching'}));leads=[...leads,...add];save();e.target.value=''};render()</script></body></html>
